<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#1E3A8A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Circles -->
  <circle cx="300" cy="225" r="180" fill="#EFF6FF" />
  <circle cx="480" cy="90" r="40" fill="#DBEAFE" opacity="0.6" />
  <circle cx="100" cy="350" r="50" fill="#DBEAFE" opacity="0.6" />

  <!-- Main Card Container -->
  <rect x="120" y="70" width="360" height="280" rx="20" fill="white" filter="url(#shadow)" />

  <!-- Card Top Bar -->
  <path d="M 120 90 Q 120 70 140 70 L 460 70 Q 480 70 480 90 L 480 130 L 120 130 Z" fill="url(#grad1)" />
  
  <!-- Lock Icon -->
  <circle cx="300" cy="130" r="35" fill="white" filter="url(#shadow)" />
  <path d="M 290 130 L 290 120 Q 290 110 300 110 Q 310 110 310 120 L 310 130" stroke="#2563EB" stroke-width="4" stroke-linecap="round" fill="none" />
  <rect x="286" y="130" width="28" height="22" rx="4" fill="#2563EB" />
  <circle cx="300" cy="140" r="3" fill="white" />

  <!-- Form Lines Representation -->
  <rect x="170" y="195" width="260" height="24" rx="12" fill="#F1F5F9" />
  <circle cx="190" cy="207" r="5" fill="#94A3B8" />
  <rect x="210" y="204" width="120" height="6" rx="3" fill="#CBD5E1" />

  <rect x="170" y="235" width="260" height="24" rx="12" fill="#F1F5F9" />
  <circle cx="190" cy="247" r="5" fill="#94A3B8" />
  <rect x="210" y="244" width="80" height="6" rx="3" fill="#CBD5E1" />

  <!-- Login Button Graphic -->
  <rect x="170" y="280" width="260" height="36" rx="18" fill="url(#grad2)" filter="url(#shadow)" />
  <rect x="270" y="295" width="60" height="6" rx="3" fill="white" />

  <!-- Shield Badge -->
  <g transform="translate(410, 240)">
    <path d="M 20 0 C 35 0, 40 10, 40 25 C 40 45, 20 60, 20 60 C 20 60, 0 45, 0 25 C 0 10, 5 0, 20 0 Z" fill="#10B981" />
    <path d="M 12 25 L 18 31 L 28 19" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
