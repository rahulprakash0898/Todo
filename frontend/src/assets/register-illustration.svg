<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" fill="none">
  <defs>
    <linearGradient id="regGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="1" />
    </linearGradient>
    <filter id="regShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#312E81" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Circles -->
  <circle cx="300" cy="225" r="180" fill="#EEF2FF" />
  <circle cx="120" cy="100" r="45" fill="#E0E7FF" opacity="0.7" />
  <circle cx="490" cy="340" r="55" fill="#E0E7FF" opacity="0.7" />

  <!-- Main Document Board -->
  <rect x="140" y="60" width="320" height="320" rx="20" fill="white" filter="url(#regShadow)" />

  <!-- Top Header Ribbon -->
  <path d="M 140 80 Q 140 60 160 60 L 440 60 Q 460 60 460 80 L 460 120 L 140 120 Z" fill="url(#regGrad)" />
  <rect x="230" y="85" width="140" height="10" rx="5" fill="white" opacity="0.9" />

  <!-- User Avatar Circle -->
  <circle cx="300" cy="120" r="30" fill="white" filter="url(#regShadow)" />
  <circle cx="300" cy="112" r="10" fill="#4F46E5" />
  <path d="M 284 134 C 284 125, 290 122, 300 122 C 310 122, 316 125, 316 134 Z" fill="#4F46E5" />

  <!-- Form Fields -->
  <rect x="180" y="175" width="240" height="26" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
  <rect x="195" y="184" width="90" height="8" rx="4" fill="#94A3B8" />

  <rect x="180" y="215" width="240" height="26" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
  <rect x="195" y="224" width="130" height="8" rx="4" fill="#94A3B8" />

  <rect x="180" y="255" width="240" height="26" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
  <rect x="195" y="264" width="110" height="8" rx="4" fill="#94A3B8" />

  <!-- Submit Button -->
  <rect x="180" y="305" width="240" height="38" rx="19" fill="url(#regGrad)" filter="url(#regShadow)" />
  <rect x="260" y="320" width="80" height="8" rx="4" fill="white" />

  <!-- Floating Sparkles / Badges -->
  <g transform="translate(100, 200)">
    <circle cx="20" cy="20" r="20" fill="#3B82F6" />
    <path d="M 12 20 L 18 26 L 28 14" stroke="white" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>
</svg>
